services:
  - type: worker
    name: gga-profile-bot
    runtime: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python src/bot.py"
    disk:
      name: gga-profiles-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DB_PATH
        value: "/data/gga_profiles.db"
      - key: DISCORD_TOKEN
        sync: false
      - key: GUILD_ID
        sync: false
